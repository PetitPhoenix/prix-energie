name: CI

# Le site n'est pas versionné : il se reconstruit ici à chaque poussée, depuis les
# CSV du dépôt. L'historique ne porte donc que le code et les données, et non les
# sept mégaoctets de figures qu'une mise à jour mensuelle régénérerait entièrement.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer
        run: python -m pip install -c constraints.txt -e ".[dev]" pyflakes
      - name: Noms non définis et imports morts
        run: python -m pyflakes src tests
      - name: Tests rapides
        run: python -m pytest -q

  site:
    # Les figures se reconstruisent depuis les CSV versionnés : aucun accès réseau
    # aux producteurs, donc un résultat reproductible et une exécution d'une minute.
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer
        run: python -m pip install -c constraints.txt -e .
      - name: Construire les figures et les pages
        # S'arrête si une figure du catalogue manque ou si une page appelle une
        # figure introuvable : un site incomplet n'est pas publié.
        run: python -m prix_energie build --only figures
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publication:
    # Seule la branche principale publie : une proposition de modification
    # construit le site et le vérifie, sans le mettre en ligne.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
